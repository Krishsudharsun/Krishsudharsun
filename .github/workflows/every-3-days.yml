name: 3-Day Activity Commit

on:
  schedule:
    # 04:00 UTC daily = 09:30 IST. The job runs every day but only commits
    # on every 3rd day (see the "Check interval" step).
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: activity-commits
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check interval
        id: gate
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( day % 3 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not a 3-day run day (day index $day). Skipping."
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Record run
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p .github/activity
          echo "last run (every 3 days): $(date -u '+%Y-%m-%d %H:%M UTC')" > .github/activity/every-3-days.txt

      - name: Commit and push
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "Krishsudharsun"
          git config user.email "127429299+Krishsudharsun@users.noreply.github.com"
          git add .github/activity/every-3-days.txt
          git commit -m "chore: 3-day sync $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
