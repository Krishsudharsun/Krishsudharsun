name: Daily Profile Sync

on:
  schedule:
    # 03:30 UTC daily = 09:00 IST
    - cron: '30 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh stats.svg and README timestamp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "Krishsudharsun"
          git config user.email "127429299+Krishsudharsun@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: daily sync $(date -u +%Y-%m-%d)"
            git push
          fi
