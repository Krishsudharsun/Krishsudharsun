<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <rect width="900" height="220" fill="#0d1117"/>
  <text x="30" y="36" font-size="20" fill="#e6edf3" font-weight="700">UPFINITY — Role Timeline</text>
  <line x1="30" y1="48" x2="870" y2="48" stroke="#21262d" stroke-width="1"/>

  <!-- axis -->
  <line x1="120" y1="80" x2="820" y2="80" stroke="#30363d" stroke-width="2"/>

  <!-- May 2025 -->
  <circle cx="140" cy="80" r="5" fill="#e6edf3"/>
  <text x="140" y="65" font-size="11" fill="#8b949e" text-anchor="middle">May 2025</text>

  <!-- Mar 2026 -->
  <circle cx="560" cy="80" r="5" fill="#39d353"/>
  <text x="560" y="65" font-size="11" fill="#8b949e" text-anchor="middle">Mar 2026</text>

  <!-- Present -->
  <circle cx="800" cy="80" r="5" fill="#58a6ff"/>
  <text x="800" y="65" font-size="11" fill="#8b949e" text-anchor="middle">Present</text>

  <!-- bars for roles -->
  <rect x="140" y="100" width="660" height="10" fill="#3fb95022" />
  <text x="140" y="128" font-size="12" fill="#e6edf3">Founder &amp; Team Manager</text>
  <line x1="140" y1="100" x2="800" y2="100" stroke="#39d353" stroke-width="6"/>

  <rect x="140" y="140" width="420" height="10" fill="#58a6ff22" />
  <text x="140" y="168" font-size="12" fill="#8b949e">Frontend Developer</text>
  <line x1="140" y1="140" x2="560" y2="140" stroke="#8b949e" stroke-width="6"/>

  <text x="580" y="168" font-size="12" fill="#e6edf3">Backend Developer</text>
  <line x1="560" y1="140" x2="800" y2="140" stroke="#58a6ff" stroke-width="6"/>

  <text x="140" y="200" font-size="12" fill="#e6edf3">Database Administrator</text>
  <line x1="560" y1="180" x2="800" y2="180" stroke="#e6edf3" stroke-width="6"/>
</svg>
