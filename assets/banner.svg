<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <rect width="1000" height="260" rx="10" fill="#0d1117"/>
  <rect width="1000" height="260" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- terminal title bar -->
  <rect width="1000" height="34" rx="10" fill="#161b22"/>
  <rect y="20" width="1000" height="14" fill="#161b22"/>
  <circle cx="24" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="17" r="6" fill="#27c93f"/>
  <text x="500" y="22" text-anchor="middle" font-size="12" fill="#8b949e">krish@upfinity: ~</text>

  <!-- terminal body -->
  <text x="28" y="68" font-size="15" fill="#8b949e">$ whoami</text>
  <text x="28" y="92" font-size="18" fill="#39d353" font-weight="700">krishsudharsun_l</text>

  <text x="28" y="126" font-size="15" fill="#8b949e">$ cat role.txt</text>
  <text x="28" y="150" font-size="16" fill="#e6edf3">founder &amp; backend developer — UPFINITY</text>
  <text x="28" y="172" font-size="16" fill="#e6edf3">cybersecurity + OSINT, on the side of everything else</text>

  <text x="28" y="206" font-size="15" fill="#8b949e">$ echo $STATUS</text>
  <text x="28" y="228" font-size="15" fill="#58a6ff">building things. probing things. shipping things.</text>

  <!-- blinking cursor block -->
  <rect x="28" y="238" width="10" height="16" fill="#39d353">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
